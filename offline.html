<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline - PS Society Solutions</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #090d16 0%, #151c2e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }
    .offline-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(234, 88, 12, 0.3);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .brand-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #ea580c, #f59e0b);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 8px 24px rgba(234, 88, 12, 0.3);
    }
    .brand-name {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .brand-name span { color: #f59e0b; }
    .brand-sub {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 24px;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .offline-icon {
      font-size: 56px;
      margin-bottom: 12px;
      display: block;
      color: #f59e0b;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .offline-msg {
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .contact-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .contact-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: 0.2s;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .contact-btn.phone {
      background: rgba(37, 99, 235, 0.15);
      color: #60a5fa;
      border-color: rgba(37, 99, 235, 0.3);
    }
    .contact-btn.whatsapp {
      background: rgba(37, 211, 102, 0.15);
      color: #34d399;
      border-color: rgba(37, 211, 102, 0.3);
    }
    .contact-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .contact-btn i { font-size: 22px; }
    .contact-btn .btn-label { font-size: 0.85rem; opacity: 0.7; font-weight: 400; }
    .footer-note {
      font-size: 0.75rem;
      color: #64748b;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 16px;
      margin-top: 8px;
    }
    .footer-note strong { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="offline-card">
    <!-- Brand -->
    <div class="brand-icon">PS</div>
    <div class="brand-name"><span>PS</span> Society Solutions</div>
    <div class="brand-sub">Smart Society Management Engine</div>

    <!-- Offline Status -->
    <span class="offline-icon">📡</span>
    <h2>You're Offline</h2>
    <p class="offline-msg">
      Please connect to the internet to access the full<br>
      management portal. Your society data is safe with us.
    </p>

    <!-- Contact Buttons -->
    <div class="contact-grid">
      <a href="tel:+918866376056" class="contact-btn phone">
        <i class="fa-solid fa-phone"></i>
        <span>📞 Call Us <span class="btn-label">+91 8866376056</span></span>
      </a>
      <a href="https://wa.me/918866376056?text=Hi,%20I%20am%20offline%20but%20need%20help." target="_blank" class="contact-btn whatsapp">
        <i class="fa-brands fa-whatsapp"></i>
        <span>💬 WhatsApp <span class="btn-label">+91 8866376056</span></span>
      </a>
    </div>

    <!-- Footer -->
    <div class="footer-note">
      <strong>PS Society Solutions</strong> &bull; Vadodara, Gujarat<br>
      &copy; 2026 All rights reserved
    </div>
  </div>

  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
