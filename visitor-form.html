<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Visitor Self Check-in | PS Society</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 60%, #1e3a8a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .checkin-card {
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 30px 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .checkin-card .brand {
      text-align: center;
      border-bottom: 3px solid #f59e0b;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .checkin-card .brand h2 {
      font-weight: 900;
      font-size: 26px;
      color: #0f172a;
      margin: 0;
    }
    .checkin-card .brand h2 .gold { color: #f59e0b; }
    .checkin-card .brand p {
      font-size: 14px;
      color: #64748b;
      font-weight: 600;
      margin: 0;
    }
    .form-label {
      font-weight: 700;
      font-size: 14px;
      color: #1e293b;
    }
    .form-control, .form-select {
      border-radius: 14px;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      font-size: 15px;
      transition: 0.2s;
    }
    .form-control:focus, .form-select:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
      background: #fff;
    }
    .btn-submit {
      background: linear-gradient(90deg, #f59e0b, #d97706);
      border: none;
      color: #fff;
      font-weight: 800;
      padding: 14px;
      border-radius: 50px;
      width: 100%;
      font-size: 18px;
      transition: 0.2s;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(245, 158, 11, 0.4);
      color: #fff;
    }
    .btn-submit:disabled {
      opacity: 0.6;
      transform: none;
      cursor: not-allowed;
    }
    .alert-custom {
      border-radius: 16px;
      padding: 14px 18px;
      margin-top: 16px;
      display: none;
    }
    .footer-text {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 20px;
      border-top: 1px solid #e2e8f0;
      padding-top: 16px;
    }
  </style>
</head>
<body>

<div class="checkin-card">
  <div class="brand">
    <h2><span class="gold">PS</span> Society</h2>
    <p>Self Check-in · Visitor Registration</p>
  </div>

  <!-- Success / Error Alert -->
  <div id="alertMessage" class="alert-custom" role="alert"></div>

  <form id="visitorForm" onsubmit="submitVisitor(event)">
    <!-- Hidden: Society Name (auto-filled from URL) -->
    <input type="hidden" id="societyName" value="">

    <div class="mb-3">
      <label class="form-label"><i class="fa-regular fa-user me-2" style="color:#f59e0b;"></i>Full Name</label>
      <input type="text" id="fullName" class="form-control" placeholder="e.g. Rajesh Kumar" required>
    </div>

    <div class="mb-3">
      <label class="form-label"><i class="fa-regular fa-phone me-2" style="color:#f59e0b;"></i>Mobile Number</label>
      <input type="tel" id="mobile" class="form-control" placeholder="9876543210" required>
    </div>

    <div class="mb-3">
      <label class="form-label"><i class="fa-regular fa-building me-2" style="color:#f59e0b;"></i>Select Flat</label>
      <select id="flatNo" class="form-select" required>
        <option value="">-- Loading Flats... --</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label"><i class="fa-regular fa-tag me-2" style="color:#f59e0b;"></i>Category</label>
      <select id="category" class="form-select" required>
        <option value="Guest">Guest</option>
        <option value="Delivery">Delivery</option>
        <option value="Service Person">Service Person</option>
        <option value="Others">Others</option>
      </select>
    </div>

    <div class="mb-4">
      <label class="form-label"><i class="fa-regular fa-pen-to-square me-2" style="color:#f59e0b;"></i>Purpose</label>
      <input type="text" id="purpose" class="form-control" placeholder="e.g. Meeting with A-101">
    </div>

    <button type="submit" id="submitBtn" class="btn-submit">
      <i class="fa-regular fa-paper-plane me-2"></i> Submit Entry
    </button>
  </form>

  <div class="footer-text">
    <i class="fa-regular fa-lock me-1"></i> Secure · Powered by PS Society Solutions
  </div>
</div>

<script>
  // ==================== SUPABASE CONFIG ====================
  const SUPABASE_URL = 'https://kuxttskznuzbtmfxtifr.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1eHR0c2t6bnV6YnRtZnh0aWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5Mjg3OTQsImV4cCI6MjEwMTUwNDc5NH0.tc4XXUeDI19R1XsFJasO0Aq9gTg3JrzPL1JWM83RnYM';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ==================== GET SOCIETY FROM URL ====================
  const urlParams = new URLSearchParams(window.location.search);
  const society = urlParams.get('society') || 'Demo Society';
  document.getElementById('societyName').value = society;

  // ==================== LOAD FLATS FOR THIS SOCIETY ====================
  async function loadFlats() {
    const select = document.getElementById('flatNo');
    select.innerHTML = '<option value="">⏳ Loading...</option>';
    try {
      const { data, error } = await _supabase
        .from('members')
        .select('flat_no')
        .eq('society_name', society)
        .order('flat_no');

      if (error) throw error;
      if (!data || data.length === 0) {
        select.innerHTML = '<option value="">⚠️ No flats found</option>';
        return;
      }

      select.innerHTML = '<option value="">-- Select Flat --</option>';
      data.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.flat_no;
        opt.textContent = m.flat_no;
        select.appendChild(opt);
      });
    } catch (err) {
      console.error('Error loading flats:', err);
      select.innerHTML = '<option value="">❌ Failed to load flats</option>';
    }
  }

  // ==================== SUBMIT VISITOR ====================
  async function submitVisitor(event) {
    event.preventDefault();
    const btn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertMessage');

    // Disable button & show spinner
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Submitting...';
    alertBox.style.display = 'none';
    alertBox.className = 'alert-custom';

    // Get form data
    const name = document.getElementById('fullName').value.trim();
    const mobile = document.getElementById('mobile').value.trim();
    const flat = document.getElementById('flatNo').value;
    const category = document.getElementById('category').value;
    const purpose = document.getElementById('purpose').value.trim();

    // Validate
    if (!name || !mobile || !flat) {
      showAlert('Please fill all required fields.', 'danger');
      resetButton();
      return;
    }

    const now = new Date();
    const today = now.toISOString().split('T')[0];
    const timeStr = now.toTimeString().substring(0,8);

    const newVisitor = {
      society: society,
      visit_date: today,
      name: name,
      mobile: mobile,
      flat_no: flat,
      category: category,
      purpose: purpose || '',
      in_time: timeStr,
      out_time: null,
      status: 'IN'
    };

    try {
      const { data, error } = await _supabase
        .from('visitors')
        .insert([newVisitor])
        .select();

      if (error) throw error;

      showAlert('✅ Check-in Successful! Welcome to the society.', 'success');
      document.getElementById('visitorForm').reset();
      // Reset flat dropdown to placeholder
      document.getElementById('flatNo').innerHTML = '<option value="">-- Select Flat --</option>';
      loadFlats(); // Reload flats in case

    } catch (err) {
      console.error('Submit error:', err);
      showAlert('❌ Failed to submit. Please try again. Error: ' + err.message, 'danger');
    }

    resetButton();
  }

  // ==================== HELPER FUNCTIONS ====================
  function showAlert(message, type) {
    const alertBox = document.getElementById('alertMessage');
    alertBox.textContent = message;
    alertBox.className = `alert-custom alert alert-${type}`;
    alertBox.style.display = 'block';
  }

  function resetButton() {
    const btn = document.getElementById('submitBtn');
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-regular fa-paper-plane me-2"></i> Submit Entry';
  }

  // ==================== LOAD ON START ====================
  window.onload = function() {
    loadFlats();
  };
</script>

<!-- Bootstrap Bundle JS (for any future modals, but not strictly needed here) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
